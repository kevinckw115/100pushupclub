name: Staging database migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview pending migrations or apply a reviewed preview
        type: choice
        options: [preview, apply]
        default: preview
        required: true
      reviewed_sha:
        description: Full commit SHA from successful preview (required for apply)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: staging-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DEPLOY_MODE: ${{ inputs.mode }}
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: tools/backend/package-lock.json
      - name: Validate target and reviewed commit
        run: node scripts/staging-guard.mjs
      - name: Record review target
        shell: bash
        run: |
          printf 'Mode: `%s`\n\nCommit: `%s`\n\nProject: `%s`\n' "$DEPLOY_MODE" "$GITHUB_SHA" "$SUPABASE_PROJECT_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned Supabase CLI
        run: npm ci --prefix tools/backend
      - name: Link staging project
        run: node tools/backend/scripts/cli.mjs link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Inspect migration history
        run: node tools/backend/scripts/cli.mjs migration list --linked
      - name: Preview pending migrations
        run: node tools/backend/scripts/cli.mjs db push --linked --dry-run
      - name: Apply reviewed migrations
        if: inputs.mode == 'apply'
        run: node tools/backend/scripts/cli.mjs db push --linked --yes
      - name: Inspect resulting migration history
        if: inputs.mode == 'apply'
        run: node tools/backend/scripts/cli.mjs migration list --linked
